<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpusGuard SDK Live Test</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #1a1a1a; color: white; }
        button { background: #ef4444; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #dc2626; }
        .log { background: #333; padding: 10px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🛡️ OpusGuard Live Test</h1>
    <p>Check the console (F12) to see OpusGuard in action when you click the buttons below.</p>

    <!-- Import Opus SDK -->
    <script type="module">
        import Opus from './opus.js';

        // 1. Initialize the SDK
        Opus.init({
            apiKey: 'sirp_demo_key_123456789', // Valid Demo Key
            endpoint: 'http://localhost:5000', // Ensure your backend is running
            service: 'live-test-app',
            env: 'dev',
            debug: true // Enables console logs from the SDK
        });

        // 2. Add functions to trigger errors
        window.triggerUnhandledError = () => {
            // This error will be automatically caught by window.onerror
            console.log("Triggering unhandled error...");
            nonExistentFunction(); 
        };

        window.triggerPromiseRejection = () => {
            // This will be automatically caught by unhandledrejection
            console.log("Triggering unhandled promise rejection...");
            Promise.reject(new Error("Database connection failed randomly"));
        };

        window.triggerManualError = () => {
            console.log("Sending a manual error capture...");
            try {
                throw new Error("Payment gateway timeout");
            } catch (error) {
                Opus.captureError(error, {
                    severity: 'critical',
                    tags: ['payment', 'timeout'],
                    metadata: { user: 'dhruv_123' }
                });
                alert("Manual error captured and sent to OpusGuard!");
            }
        };  
    </script>

    <div>
        <button onclick="triggerUnhandledError()">Trigger Unhandled Error</button>
        <button onclick="triggerPromiseRejection()">Trigger Promise Rejection</button>
        <button onclick="triggerManualError()">Send Manual Error</button>
    </div>

    <div class="log" id="logBox">
        1. Ensure your backend is running on http://localhost:5000.<br>
        2. Click the buttons above.<br>
        3. Check your backend terminal or MongoDB to see the captured incidents.
    </div>
</body>
</html>
